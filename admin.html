<script type="module">
import {CATS, MECA, catById, weightCat, members, cupoError, clean, uid, esc, makeBracket, compute, addWin, undoWin, catStatus, seedExample, planPesaje, aplicarPesaje, correoOk} from '/motor.js';
import {catChips, viewVivo, viewCategoria, viewPodio, viewCupos} from '/vistas.js';
import {achicarFoto, cara} from '/fotos.js';

const $ = id => document.getElementById(id);
let S = null, version = 0, clave = '';
const ui = {view:'llaves', cat:'vivo', confirm:null, filter:'todas', importMsg:null};
const pending = [];
let busy = false, syncState = 'ok';

/* ---------- conexión con el servidor ---------- */
async function api(method, body){
  const r = await fetch('/api/estado', {method, cache:'no-store', headers:{'Content-Type':'application/json', 'x-clave':clave}, body:body ? JSON.stringify(body) : undefined});
  let j = {};
  try { j = await r.json(); } catch {}
  return {status:r.status, ...j};
}

// Cada cambio se aplica al instante en pantalla y se guarda en orden.
// Si entretanto llegó una inscripción, se toma el estado nuevo y se vuelven a aplicar los cambios pendientes.
function mutate(fn){
  fn(S);
  pending.push(fn);
  render();
  flush();
}
async function flush(){
  if (busy) return;
  busy = true;
  showSync('saving');
  while (pending.length){
    const n = pending.length;
    let r;
    try { r = await api('PUT', {version, state:S}); } catch { r = {status:0}; }
    if (r.status === 200){ version = r.version; pending.splice(0, n); continue; }
    if (r.status === 409){
      S = clean(r.state); version = r.version;
      for (const fn of pending) fn(S);
      render();
      continue;
    }
    showSync('error', r.error);
    busy = false;
    setTimeout(flush, 4000);
    return;
  }
  busy = false;
  showSync('ok');
}
function showSync(st, msg){
  syncState = st;
  $('sync').textContent = {ok:'· Guardado', saving:'· Guardando…', error:`· No se pudo guardar${msg ? ': ' + msg : ''}. Reintentando…`}[st];
}

async function poll(){
  if (busy || pending.length || !S) return;
  try {
    const r = await api('GET');
    if (r.status === 200 && r.version !== version && !pending.length && !busy){
      S = clean(r.state); version = r.version;
      const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if (!typing) render();
    }
  } catch {}
}

/* ---------- ingreso ---------- */
function viewLogin(msg){
  $('tabs').hidden = true;
  $('app').innerHTML = `<section class="panel login">
    <h2>Entrar</h2>
    <p class="muted">Escribe la clave de organizador que configuraste en Vercel.</p>
    ${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
    <form id="login" novalidate><label class="f">Clave<input type="password" id="clave" autocomplete="current-password" required></label>
    <div class="row"><button class="btn primary" type="submit">Entrar</button></div></form>
  </section>`;
  $('clave').focus();
}
async function login(c){
  clave = c;
  let r;
  try { r = await api('GET'); } catch { r = {status:0, error:'No hay conexión.'}; }
  if (r.status !== 200){
    try { sessionStorage.removeItem('aw-clave'); } catch {}
    return viewLogin(r.status === 401 ? 'Clave incorrecta.' : r.error || 'No se pudo conectar.');
  }
  try { sessionStorage.setItem('aw-clave', c); } catch {}
  S = clean(r.state); version = r.version;
  $('tabs').hidden = false;
  showSync('ok');
  render();
  setInterval(() => { if (!document.hidden) poll(); }, 4000);
}

/* ---------- importar desde Google Forms ---------- */
// Lee filas pegadas desde la hoja de respuestas (separadas por tabulación) y ubica cada columna por su título.
// Una pregunta puede repetirse en varias secciones del formulario: se toman todas sus columnas.
function importRows(st, text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return {type:'err', text:'Pega también la fila de títulos y al menos una respuesta.'};
  const head = lines[0].split('\t').map(h => h.trim().toLowerCase());
  const cols = re => head.map((h, i) => re.test(h) ? i : -1).filter(i => i >= 0);
  const ci = {name:cols(/nombre/), career:cols(/^¿?\s*carrera/), other:cols(/cu[aá]l/), year:cols(/año|ano\b/), section:cols(/secci[oó]n/), email:cols(/correo|e-?mail/), weight:cols(/peso/).filter(i => !/categor/.test(head[i])), cats:cols(/categor/)};
  if (!ci.name.length || !ci.cats.length) return {type:'err', text:'No encontré las columnas "Nombre completo" y "Categorías". Revisa que copiaste la fila de títulos.'};
  let added = 0;
  const notes = [];
  for (const line of lines.slice(1)){
    const c = line.split('\t').map(x => x.trim());
    const get = is => is.map(i => c[i] || '').filter(Boolean).join(', ');
    const name = get(ci.name).replace(/\s+/g, ' ');
    if (!name || st.competitors.some(x => x.name.toLowerCase() === name.toLowerCase())) continue;
    const careerRaw = get(ci.career);
    const isMeca = /mec[aá]nica automotriz/i.test(careerRaw);
    const career = isMeca ? MECA : (get(ci.other) || careerRaw || 'Otra carrera');
    const weight = parseFloat(get(ci.weight).replace(',', '.').replace(/[^0-9.]/g, ''));
    const sel = get(ci.cats).toLowerCase();
    const cats = [];
    const wantPeso = /peso/.test(sel);
    if (wantPeso && !isMeca) notes.push(`${esc(name)}: las categorías de peso son solo para ${MECA}; quedó solo en las libres.`);
    if (wantPeso && isMeca && !(weight >= 30)) notes.push(`${esc(name)}: sin peso válido, no se asignó categoría de peso.`);
    if (wantPeso && isMeca && weight >= 30) cats.push(weightCat(weight) + 'd');
    if (/libre[^,]*derech/.test(sel)) cats.push('ld');
    if (/libre[^,]*izquier/.test(sel)) cats.push('li');
    const ok = cats.filter(id => { const e = cupoError(st, id); if (e) notes.push(`${esc(name)}: ${esc(e)}`); return !e; });
    if (!ok.length){ notes.push(`${esc(name)}: no quedó en ninguna categoría.`); continue; }
    const year = get(ci.year), section = get(ci.section), email = get(ci.email).toLowerCase();
    st.competitors.push({id:uid(), name, ...(correoOk(email) ? {email} : {}), career, club:`${career}${year ? ' · ' + year + ' año' : ''}${section ? ' · Sec. ' + section : ''}`, weight:weight >= 30 ? Math.round(weight * 10) / 10 : 0, cats:ok, weighed:false, at:Date.now()});
    added++;
  }
  return {type:notes.length ? 'err' : 'ok', text:`Se agregaron ${added} competidor${added === 1 ? '' : 'es'}.` + (notes.length ? '<br>Revisa: ' + notes.join('<br>') : '')};
}

/* ---------- vistas ---------- */
function confirmBtn(key, label, yes, act, extra = ''){
  if (ui.confirm === key) return `<span class="confirm">¿Seguro? <button class="btn small primary" data-act="${act}" ${extra}>${yes}</button><button class="btn small" data-act="cancel">Cancelar</button></span>`;
  return `<button class="btn small danger" data-act="ask" data-key="${key}">${label}</button>`;
}

function render(){
  if (!S) return;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-current', String(b.dataset.view === ui.view)));
  const live = CATS.filter(c => catStatus(S, c.id) === 'live').length;
  $('meta').textContent = `${S.competitors.length} inscritos · ${CATS.length} llaves · ${live} en curso`;
  const banner = S.example ? `<div class="banner"><span><strong>Datos de prueba.</strong> Los competidores y resultados son inventados. Bórralos antes de abrir las inscripciones.</span>${confirmBtn('clear', 'Borrar todo y empezar de cero', 'Sí, borrar todo', 'clear-all')}</div>` : '';
  const app = $('app');
  const scrolls = [...app.querySelectorAll('.rounds')].map(el => el.scrollLeft);
  app.innerHTML = banner + ({competidores:viewCompetidores, llaves:viewLlaves, podio:() => viewPodioAdmin(), compartir:viewCompartir}[ui.view])();
  app.querySelectorAll('.rounds').forEach((el, i) => { el.scrollLeft = scrolls[i] || 0; });
  if (ui.view === 'compartir') drawQR();
}

function viewLlaves(){
  return catChips(S, ui.cat) + (ui.cat === 'vivo' ? viewVivo(S, true) : viewCategoria(S, ui.cat, true, confirmBtn));
}

function viewCompetidores(){
  const list = S.competitors.filter(c => ui.filter === 'todas' || c.cats.includes(ui.filter)).slice().sort((a, b) => a.weight - b.weight);
  const opts = ['<option value="todas">Todas las categorías</option>'].concat(CATS.map(c => `<option value="${c.id}" ${ui.filter === c.id ? 'selected' : ''}>${c.label} (${members(S, c.id).length})</option>`)).join('');
  const rows = list.map(c => `<tr>
      <td><div class="who"><button class="facebtn" data-act="foto" data-id="${c.id}" title="${c.foto ? 'Cambiar' : 'Agregar'} foto de ${esc(c.name)}">${cara(c, 'md' + (c.fotoRev ? ' rev' : ''))}</button><div><strong>${esc(c.name)}</strong><br>${c.email
        ? `<button class="linkbtn" data-act="correo" data-id="${c.id}" title="Cambiar correo">${esc(c.email)}</button>`
        : `<button class="linkbtn falta" data-act="correo" data-id="${c.id}">+ Agregar correo</button>`}</div></div></td>
      <td>${esc(c.club || '—')}</td>
      <td class="kg">${c.weight ? c.weight.toFixed(1) + ' kg' : '—'}${c.weighed && c.declared !== undefined && c.declared !== c.weight ? `<br><span class="hint">declaró ${c.declared ? c.declared.toFixed(1) : '—'}</span>` : ''}</td>
      <td>${c.cats.map(id => `<span class="chip ${catById(id).arm === 'd' ? 'ld' : 'li'}">${catById(id).short}</span>`).join('')}</td>
      <td>${c.weighed ? `<button class="btn small pesado" data-act="pesar" data-id="${c.id}" title="Corregir el peso de ${esc(c.name)}">✓ Pesado</button>` : `<button class="btn small" data-act="pesar" data-id="${c.id}">Pesar</button>`}</td>
      <td>${confirmBtn('del-' + c.id, 'Quitar', 'Sí, quitar', 'del', `data-id="${c.id}"`)}</td>
    </tr>`).join('');
  const imp = ui.importMsg; ui.importMsg = null;
  const empty = !S.competitors.length && !S.example
    ? `<div class="banner"><span>Aún no hay inscritos. Comparte el link de la pestaña <strong>Compartir</strong>. Si quieres probar la app antes, carga datos inventados.</span><button class="btn small" data-act="example">Cargar datos de prueba</button></div>` : '';
  return `${empty}<section class="panel">
    <div class="row" style="justify-content:space-between"><h2>Competidores</h2>
      <div class="row">${S.competitors.some(c => c.email) ? '<button class="btn small primary" data-act="enviar">Enviar correo</button>' : ''}${list.some(c => c.email) ? `<button class="btn small" data-act="copy-mails">Copiar correos (${list.filter(c => c.email).length})</button>` : ''}
      <label class="f" style="flex-direction:row;align-items:center;gap:8px"><span class="muted">Ver</span><select id="filter" style="width:auto">${opts}</select></label></div></div>
    <p class="muted">${list.length} competidor${list.length === 1 ? '' : 'es'}. ${S.competitors.filter(c => c.weighed).length} de ${S.competitors.length} pesados. ${S.competitors.filter(c => !c.email).length ? `${S.competitors.filter(c => !c.email).length} sin correo. ` : ''}${S.competitors.some(c => c.fotoRev) ? `<strong class="revtxt">${S.competitors.filter(c => c.fotoRev).length} foto${S.competitors.filter(c => c.fotoRev).length === 1 ? '' : 's'} por revisar</strong> (toca la cara marcada en rojo). ` : ''}Toca <strong>Pesar</strong> cuando cada uno pase por la balanza: anotas su peso real y, si corresponde, pasa solo a su categoría.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Nombre</th><th>Carrera y curso</th><th>Peso</th><th>Categorías</th><th>Pesaje</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" class="empty">Nadie inscrito todavía.</td></tr>'}</tbody>
    </table></div>
  </section>
  <section class="panel"><h3>Cupos</h3><div class="cupos">${viewCupos(S)}</div></section>
  <details class="panel imp" ${imp ? 'open' : ''}>
    <summary><h3>Importar inscritos desde Google Forms</h3></summary>
    <p class="hint">Si alguien se inscribió en el formulario antiguo: en la hoja de respuestas selecciona todo (incluida la fila de títulos), cópialo y pégalo aquí. Se agregan solo los que no estén ya en la lista.</p>
    <textarea id="imp-text" rows="5" placeholder="Pega aquí las filas copiadas de Google Sheets"></textarea>
    <div class="row"><button class="btn primary" data-act="import">Importar</button></div>
    ${imp ? `<div class="msg ${imp.type}">${imp.text}</div>` : ''}
  </details>`;
}

function viewCompartir(){
  const base = location.origin;
  const link = (title, url, hint, qr) => `<section class="panel"><h3>${title}</h3>
    <div class="qr">${qr ? '<div id="qrbox" role="img" aria-label="Código QR de la ficha de inscripción"></div>' : ''}
      <div style="display:flex;flex-direction:column;gap:8px;min-width:0;flex:1">
        <span class="link">${url}</span>
        <div class="row"><button class="btn small" data-act="copy" data-url="${url}">Copiar link</button><a class="btn small" href="${url}" target="_blank" rel="noopener">Abrir</a></div>
        <span class="hint">${hint}</span>
      </div></div></section>`;
  return `<h2>Compartir</h2>
    ${link('Ficha de inscripción', base + '/', 'Para los alumnos. Imprime el QR o compártelo por WhatsApp.', true)}
    ${link('Llaves en vivo', base + '/llaves', 'Para el público: ven las llaves y resultados desde su celular, sin poder cambiar nada. También sirve para proyectar.', false)}
    ${link('Este panel', base + '/admin', 'Solo para ti y quien te ayude a arbitrar. Pide la clave.', false)}`;
}

function drawQR(){
  const box = $('qrbox');
  if (!box || box.childElementCount) return;
  if (window.QRCode) new QRCode(box, {text:location.origin + '/', width:140, height:140, colorDark:'#15181D', colorLight:'#FFFFFF', correctLevel:QRCode.CorrectLevel.M});
  else box.innerHTML = '<span class="hint">No se pudo cargar el QR. Recarga la página.</span>';
}

/* ---------- pesaje ---------- */
let pz = null;
const pesoPz = () => parseFloat(($('pz-w')?.value || '').replace(',', '.'));
function openPesaje(id){
  const c = S.competitors.find(x => x.id === id);
  if (!c) return;
  pz = id;
  const declared = c.declared ?? c.weight;
  $('pesaje').innerHTML = `<form method="dialog" class="dlg-body" novalidate>
    <h2 id="pz-title">Pesaje</h2>
    <p><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.club || '')}</span></p>
    <p class="muted">Peso declarado: <strong>${declared ? declared.toFixed(1) + ' kg' : '—'}</strong> · Categorías: ${c.cats.map(x => catById(x).label).join(', ')}</p>
    <label class="f">Peso real en la balanza (kg)<input type="text" id="pz-w" inputmode="decimal" autocomplete="off" value="${c.weighed ? c.weight : ''}" placeholder="Ej: 78.4"></label>
    <div id="pz-res"></div>
  </form>`;
  $('pesaje').showModal();
  pesajeResult();
  $('pz-w').focus();
}
function pesajeResult(){
  const c = S.competitors.find(x => x.id === pz);
  if (!c) return $('pesaje').close();
  const w = pesoPz();
  const btn = (label, choice, primary) => `<button type="button" class="btn ${primary ? 'primary' : ''}" data-act="pz-save" ${choice ? `data-choice="${choice}"` : ''}>${label}</button>`;
  const cancel = '<button type="button" class="btn" data-act="pz-cancel">Cancelar</button>';
  if (!(w >= 30 && w <= 250)){ $('pz-res').innerHTML = `<p class="hint">Escribe el peso que marcó la balanza.</p><div class="row">${cancel}</div>`; return; }
  const p = planPesaje(S, c, w);
  const lab = id => catById(id).label;
  let html;
  if (!p.cur) html = `<div class="msg ok">Compite solo en libres, así que el peso solo queda anotado.</div><div class="row">${btn('Guardar pesaje', null, true)}${cancel}</div>`;
  else if (p.same) html = `<div class="msg ok">Se mantiene en <strong>${lab(p.cur)}</strong>.</div><div class="row">${btn('Guardar pesaje', null, true)}${cancel}</div>`;
  else if (p.locked) html = `<div class="msg err">Con este peso le corresponde <strong>${lab(p.to)}</strong>. ${esc(p.locked)}</div><div class="row">${btn('Guardar solo el peso', null, true)}${cancel}</div>`;
  else if (!p.toErr) html = `<div class="msg err">Con este peso le corresponde <strong>${lab(p.to)}</strong>, no ${lab(p.cur)}.</div><div class="row">${btn('Guardar y mover a ' + lab(p.to), 'mover', true)}${cancel}</div>`;
  else {
    const solo = c.cats.length === 1;
    html = `<div class="msg err">Con este peso le corresponde <strong>${lab(p.to)}</strong>, pero ${esc(p.toErr.charAt(0).toLowerCase() + p.toErr.slice(1))} Sale de ${lab(p.cur)}.</div>
      <p class="hint">Pregúntale si quiere competir en la categoría libre.</p>
      <div class="row">${p.inLd ? btn('Seguir solo en Libre brazo derecho', 'fuera', true)
        : p.ldErr ? `<span class="hint">${esc(p.ldErr)}</span>` : btn('Sí, pasar a Libre brazo derecho', 'libre', true)}
      ${p.inLd ? '' : btn(solo ? 'No, quitarlo del campeonato' : 'No, sacarlo solo de ' + lab(p.cur), 'fuera', false)}${cancel}</div>`;
  }
  $('pz-res').innerHTML = html;
}

/* ---------- correo ---------- */
let mailId = null;
function openCorreo(id){
  const c = S.competitors.find(x => x.id === id);
  if (!c) return;
  mailId = id;
  $('pesaje').innerHTML = `<form id="correo-form" class="dlg-body" novalidate>
    <h2 id="pz-title">Correo</h2>
    <p><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.club || '')}</span></p>
    <label class="f">Correo electrónico<input type="email" id="mail-in" inputmode="email" autocomplete="off" value="${esc(c.email || '')}" placeholder="Ej: nombre@inacapmail.cl"></label>
    <div id="mail-msg"></div>
    <div class="row"><button class="btn primary" type="submit">Guardar</button><button type="button" class="btn" data-act="pz-cancel">Cancelar</button></div>
  </form>`;
  $('pesaje').showModal();
  $('mail-in').focus();
}

/* ---------- foto ---------- */
let fotoId = null;
function openFoto(id, msg){
  const c = S.competitors.find(x => x.id === id);
  if (!c) return;
  fotoId = id;
  $('pesaje').innerHTML = `<div class="dlg-body">
    <h2 id="pz-title">Foto</h2>
    <div class="fotopick">${cara(c, 'xl')}<div><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.club || '')}</span></div></div>
    ${msg ? `<div class="msg ${msg[0]}">${msg[1]}</div>` : ''}
    ${c.fotoRev ? `<div class="msg err">La subió el alumno desde el link del correo y <strong>aún no se muestra</strong> en las páginas públicas. Si es su cara, apruébala.</div>
      <div class="row"><button type="button" class="btn primary" data-act="foto-ok">Aprobar foto</button></div>` : ''}
    <div class="row"><label class="btn ${c.fotoRev ? '' : 'primary'}">${c.foto ? 'Cambiar foto' : 'Elegir o tomar foto'}<input type="file" id="foto-in" accept="image/*" hidden></label>
      ${c.foto ? '<button type="button" class="btn danger" data-act="foto-quitar">Quitar foto</button>' : ''}
      <button type="button" class="btn" data-act="pz-cancel">Cerrar</button></div>
    <p class="hint">Se ve en las llaves en vivo, que son públicas. Desde el celular puedes tomarla con la cámara, por ejemplo en el pesaje.</p>
  </div>`;
  if (!$('pesaje').open) $('pesaje').showModal();
}
async function apiFoto(method, body, id){
  const r = await fetch('/api/foto' + (id ? '?id=' + encodeURIComponent(id) : ''), {method, headers:{'Content-Type':'application/json', 'x-clave':clave}, body:body ? JSON.stringify(body) : undefined});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'No se pudo guardar la foto.');
}
async function subirFoto(file){
  const id = fotoId;
  try {
    const foto = await achicarFoto(file);
    await apiFoto('PUT', {id, foto});
  } catch (e){ return openFoto(id, ['err', esc(e.message === 'foto' ? 'No se pudo leer esa foto. Prueba con otra.' : e.message)]); }
  mutate(st => { const c = st.competitors.find(x => x.id === id); if (c){ c.foto = (c.foto || 0) + 1; delete c.fotoRev; } });
  openFoto(id, ['ok', 'Foto guardada.']);
}

/* ---------- enviar correo ---------- */
// El panel no envía correos: arma el mensaje y lo abre en Gmail (o en el programa de correo del equipo)
// con los participantes en copia oculta, para que nadie vea los correos de los demás.
const GRUPOS = [
  ['todos', 'Todos los inscritos', () => true],
  ['sinpesaje', 'Los que aún no se pesan', c => !c.weighed],
  ['sinfoto', 'Los que no tienen foto', c => !c.foto],
  ...CATS.map(k => [k.id, k.label, c => c.cats.includes(k.id)]),
];
function openEnviar(pre = {}){
  $('pesaje').innerHTML = `<form id="enviar-form" class="dlg-body" novalidate>
    <h2 id="pz-title">Enviar correo</h2>
    <label class="f">Para<select id="ev-grupo">${GRUPOS.map(([id, label]) => `<option value="${id}">${label}</option>`).join('')}</select></label>
    ${pre.adjunto ? `<div class="msg ok"><strong>Adjunta el PDF:</strong> Gmail no lo agrega solo. En el correo que se abre, toca el clip 📎 (Adjuntar) y elige <strong>${PDF_NOMBRE}</strong> de tu carpeta Descargas.</div>` : ''}
    <p class="hint" id="ev-cuenta"></p>
    <label class="f">Asunto<input type="text" id="ev-asunto" value="${esc(pre.asunto || 'Campeonato de Lucha de Brazos Mecánica 2026')}"></label>
    <label class="f">Mensaje<textarea id="ev-msg" rows="6" placeholder="Ej: El pesaje será el lunes 23 de noviembre a las 13:00 en el Salón Auditorium. Trae tu credencial.">${esc(pre.msg || '')}</textarea></label>
    <div class="row"><a class="btn primary" id="ev-gmail" target="_blank" rel="noopener">Abrir en Gmail</a><a class="btn" id="ev-mailto">Otro programa de correo</a><button type="button" class="btn" data-act="pz-cancel">Cerrar</button></div>
    <p class="hint">Se abre un correo nuevo ya armado, con los participantes en copia oculta (no ven los correos de los demás). Revísalo y aprieta Enviar ahí.</p>
  </form>`;
  $('pesaje').showModal();
  enviarLinks();
}
// Al elegir "Los que no tienen foto" con el mensaje vacío, se escribe el aviso con el link para subirla.
function avisoFoto(){
  if ($('ev-grupo').value !== 'sinfoto' || $('ev-msg').value.trim()) return;
  $('ev-asunto').value = 'Sube tu foto · Campeonato de Lucha de Brazos Mecánica 2026';
  $('ev-msg').value = `Hola:\n\nEn las llaves del campeonato se mostrará la cara de cada participante y aún no tenemos tu foto. Súbela aquí, es opcional y toma un minuto:\n\n${location.origin}/mi-foto\n\nUsa el mismo correo con que te inscribiste. Una foto de tu cara, de frente.\n\n¡Nos vemos el 24 de noviembre!`;
}
function enviarLinks(){
  const [, , fn] = GRUPOS.find(g => g[0] === $('ev-grupo').value);
  const grupo = S.competitors.filter(fn);
  const mails = [...new Set(grupo.filter(c => c.email).map(c => c.email))];
  const sin = grupo.filter(c => !c.email);
  $('ev-cuenta').innerHTML = `${mails.length} destinatario${mails.length === 1 ? '' : 's'}.` + (sin.length ? ` ${sin.length} sin correo (no les llegará)${sin.length <= 8 ? ': ' + sin.map(c => esc(c.name)).join(', ') : ''}.` : '');
  const su = $('ev-asunto').value, body = $('ev-msg').value, bcc = mails.join(',');
  $('ev-gmail').href = 'https://mail.google.com/mail/?view=cm&fs=1&bcc=' + encodeURIComponent(bcc) + '&su=' + encodeURIComponent(su) + '&body=' + encodeURIComponent(body);
  $('ev-mailto').href = 'mailto:?bcc=' + encodeURIComponent(bcc) + '&subject=' + encodeURIComponent(su) + '&body=' + encodeURIComponent(body);
  for (const id of ['ev-gmail', 'ev-mailto']) $(id).classList.toggle('off', !mails.length);
}

/* ---------- resultados en PDF ---------- */
const PDF_NOMBRE = 'resultados-campeonato-2026.pdf';
function viewPodioAdmin(){
  return `<section class="panel"><div class="row" style="justify-content:space-between"><div><h3>Resultados en PDF</h3>
    <p class="hint">Descarga el podio de las 7 categorías en un PDF y envíalo a los participantes.</p></div>
    <div class="row"><button class="btn primary" data-act="pdf">Descargar PDF</button><button class="btn" data-act="pdf-mail">Enviar resultados por correo</button></div></div>
    <div id="pdf-msg"></div></section>` + viewPodio(S);
}
function cargarJsPDF(){
  if (window.jspdf) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = ok; s.onerror = fail;
    document.head.append(s);
  });
}
async function descargarPDF(){
  try { await cargarJsPDF(); } catch { $('pdf-msg').innerHTML = '<div class="msg err">No se pudo preparar el PDF. Revisa tu conexión e intenta de nuevo.</div>'; return; }
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
  const W = 210, X = 18;
  let y = 22;
  const salto = h => { if (y + h > 280){ doc.addPage(); y = 20; } };
  doc.setFillColor(196, 43, 28); doc.rect(0, 0, W, 6, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(21, 24, 29);
  doc.text('CAMPEONATO DE LUCHA DE BRAZOS', W / 2, y, {align:'center'}); y += 9;
  doc.setTextColor(196, 43, 28); doc.text('MECÁNICA 2026', W / 2, y, {align:'center'}); y += 8;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(90, 98, 113);
  doc.text('24 de noviembre · 14:00 hrs · Salón Auditorium · Resultados oficiales', W / 2, y, {align:'center'}); y += 12;
  for (const c of CATS){
    const br = S.brackets[c.id], r = br ? compute(br) : null;
    const lista = r && r.podium ? r.podium.filter(Boolean) : [];
    salto(12 + Math.max(1, lista.length) * 7);
    doc.setDrawColor(211, 216, 224); doc.line(X, y - 5, W - X, y - 5);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(21, 24, 29);
    doc.text(c.label, X, y); y += 7;
    doc.setFontSize(11);
    if (!lista.length){
      doc.setFont('helvetica', 'normal'); doc.setTextColor(90, 98, 113);
      doc.text(!br ? 'Llave sin sortear.' : `En curso: ${r.played} de ${r.total} luchas.`, X + 4, y); y += 9;
      continue;
    }
    lista.forEach((id, i) => {
      const e = br.entrants.find(p => p.id === id) || {name:'—', club:''};
      doc.setFont('helvetica', 'bold'); doc.setTextColor(i === 0 ? 196 : 21, i === 0 ? 43 : 24, i === 0 ? 28 : 29);
      doc.text(`${i + 1}°`, X + 4, y);
      doc.text(doc.splitTextToSize(e.name, 70)[0], X + 16, y);
      doc.setFont('helvetica', 'normal'); doc.setTextColor(90, 98, 113);
      doc.text(doc.splitTextToSize(e.club || '', 90)[0].replace(/\s*·\s*$/, ''), X + 88, y);
      y += 7;
    });
    y += 4;
  }
  doc.setFontSize(9); doc.setTextColor(90, 98, 113);
  doc.text('Generado el ' + new Date().toLocaleString('es-CL', {dateStyle:'long', timeStyle:'short'}), X, 290);
  doc.save(PDF_NOMBRE);
  $('pdf-msg').innerHTML = `<div class="msg ok">Listo: se descargó <strong>${PDF_NOMBRE}</strong> (queda en tu carpeta Descargas).</div>`;
}

/* ---------- acciones ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || !S) return;
  const a = t.dataset.act, d = t.dataset;
  if (a === 'pesar') return openPesaje(d.id);
  if (a === 'pz-cancel') return $('pesaje').close();
  if (a === 'correo') return openCorreo(d.id);
  if (a === 'foto') return openFoto(d.id);
  if (a === 'foto-ok'){ const id = fotoId; mutate(st => { const c = st.competitors.find(x => x.id === id); if (c) delete c.fotoRev; }); return openFoto(id, ['ok', 'Foto aprobada: ya se ve en las llaves.']); }
  if (a === 'foto-quitar'){
    const id = fotoId;
    apiFoto('DELETE', null, id).then(() => { mutate(st => { const c = st.competitors.find(x => x.id === id); if (c){ delete c.foto; delete c.fotoRev; } }); openFoto(id); })
      .catch(e => openFoto(id, ['err', esc(e.message)]));
    return;
  }
  if (a === 'enviar') return openEnviar();
  if (a === 'pdf') return descargarPDF();
  if (a === 'pdf-mail') return openEnviar({adjunto:true, asunto:'Resultados · Campeonato de Lucha de Brazos Mecánica 2026', msg:'Hola:\n\nTe enviamos los resultados oficiales del Campeonato de Lucha de Brazos Mecánica 2026 en el PDF adjunto.\n\n¡Gracias por participar!'});
  if (a === 'copy-mails'){
    const mails = S.competitors.filter(c => c.email && (ui.filter === 'todas' || c.cats.includes(ui.filter))).map(c => c.email);
    try { navigator.clipboard.writeText(mails.join(', ')).then(() => { t.textContent = 'Copiados'; }); } catch {}
    return;
  }
  if (a === 'pz-save'){
    const id = pz, w = pesoPz(), choice = d.choice || null;
    $('pesaje').close();
    return mutate(st => aplicarPesaje(st, id, w, choice));
  }
  if (a === 'nav'){ ui.view = d.view; ui.confirm = null; }
  else if (a === 'cat'){ ui.cat = d.cat; ui.confirm = null; }
  else if (a === 'ask'){ ui.confirm = d.key; }
  else if (a === 'cancel'){ ui.confirm = null; }
  else if (a === 'clear-all'){ ui.confirm = null; return mutate(st => { st.competitors = []; st.brackets = {}; delete st.example; }); }
  else if (a === 'example'){ const ex = seedExample(); return mutate(st => { Object.assign(st, structuredClone(ex)); }); }
  else if (a === 'import'){
    const text = $('imp-text').value;
    return mutate(st => { ui.importMsg = importRows(st, text); });
  }
  else if (a === 'del'){ ui.confirm = null; return mutate(st => { st.competitors = st.competitors.filter(c => c.id !== d.id); }); }
  else if (a === 'gen' || a === 'reset'){
    ui.confirm = null;
    return mutate(st => { if (a === 'reset' || !st.brackets[d.cat]) st.brackets[d.cat] = makeBracket(members(st, d.cat)); });
  }
  else if (a === 'win' || a === 'undo'){
    return mutate(st => {
      const br = st.brackets[d.cat];
      if (!br) return;
      const m = compute(br).M[d.m];
      // Si al reaplicar el cruce ya cambió (otro dispositivo marcó primero), no se hace nada.
      if (a === 'win'){ if (!m.done && m.s.includes(d.p)) addWin(br, m, d.p); }
      else undoWin(br, m);
      compute(br);
    });
  }
  else if (a === 'copy'){
    try { navigator.clipboard.writeText(d.url).then(() => { t.textContent = 'Copiado'; }); } catch {}
    return;
  }
  render();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'foto-in' && t.files[0]) return subirFoto(t.files[0]);
  if (!S) return;
  if (t.id === 'filter'){ ui.filter = t.value; render(); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'pz-w') pesajeResult();
  if (e.target.id === 'ev-grupo') avisoFoto();
  if (e.target.closest('#enviar-form')) enviarLinks();
});

document.addEventListener('submit', e => {
  if (e.target.id === 'enviar-form'){ e.preventDefault(); return; }
  if (e.target.id === 'correo-form'){
    e.preventDefault();
    const id = mailId, email = $('mail-in').value.trim().toLowerCase();
    if (email && !correoOk(email)){ $('mail-msg').innerHTML = '<div class="msg err">Ese correo no parece válido. Revisa que tenga @ y un punto.</div>'; return; }
    $('pesaje').close();
    return mutate(st => { const c = st.competitors.find(x => x.id === id); if (c){ if (email) c.email = email; else delete c.email; } });
  }
  if (e.target.closest('#pesaje')){ e.preventDefault(); $('pz-res').querySelector('.btn.primary')?.click(); return; }
  if (e.target.id !== 'login') return;
  e.preventDefault();
  login($('clave').value);
});

let saved = '';
try { saved = sessionStorage.getItem('aw-clave') || ''; } catch {}
if (saved) login(saved); else viewLogin();
</script>
